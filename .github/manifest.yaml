ci:
  config:
    schema_version: 1
    trunk_branch: main
    cli_version: v1.1.3-rc.3
    cli_version_sha: 5f7f4f6af35e0bfb2e3dc78e281c8a091e4f021d
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    triggers:
      - src/**
    builds:
      - name: shared
        workflow: .github/workflows/build-shared.yaml
        triggers: []
    notify:
      repo: stablekernel/cascade-example-primary
      workflow: external-update.yaml
      token: CASCADE_STATE_TOKEN
      deploy_name: artifact-a
      environment: staging
  state:
    prerelease:
      sha: 8991c3eeeae40a8a512b1f550fe2c5f31475ecbc
      version: v0.1.0-rc.0
      committed_at: "2026-11-23T07:16:54Z"
      committed_by: joshua-temple
